<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123B5D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Ponto">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meu Ponto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;font-family:Arial,sans-serif;color:#17324a}
header{background:#123b5d;color:#fff;padding:18px 16px 22px;border-radius:0 0 22px 22px}h1{margin:0;font-size:25px}.sub{opacity:.85;margin-top:5px;font-size:13px}
main{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #00000012}
label{font-size:12px;font-weight:700;display:block;margin:8px 0 5px}input,select,button{width:100%;height:48px;border-radius:12px;border:1px solid #cbd6df;padding:0 13px;font-size:16px;background:#fff;color:#17324a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.turnos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.turno{border:2px solid #d4dee7;background:#f8fafc;font-weight:700}.turno.ativo{border-color:#1d6fa5;background:#e7f3fb}
.primary{background:#1d6fa5;color:#fff;border:0;font-weight:700;margin-top:12px}.share{background:#e7f3fb;color:#17324a;border:0;font-weight:700;margin-top:10px}.secondary{background:#edf2f6;border:0;font-weight:700}.danger{background:#fff0f0;color:#9b2525;border:0;font-weight:700}
.result{background:#e9f5ec;border-radius:14px;padding:13px;margin-top:12px}.result strong{font-size:22px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 5px;border-bottom:1px solid #e4e9ed;text-align:center}th{font-size:11px}.scroll{overflow:auto}.muted{font-size:12px;color:#647789}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eaf1f6;font-size:11px}
</style>
</head>
<body>
<header><main style="padding:0"><h1>📋 Meu Ponto</h1><div class="sub">Controle simples • funciona no celular • sem macro</div><div id="statusRede" style="margin-top:8px;font-size:12px;font-weight:700">🟢 ONLINE</div></main></header>
<main>
<div class="card">
<label>FUNCIONÁRIO</label><input id="nome" placeholder="Digite o nome">
<label>MATRÍCULA</label><input id="mat" placeholder="Digite a matrícula">
<div class="row"><div><label>DATA</label><input id="data" type="date"></div><div><label>JORNADA</label><input value="08:48" disabled></div></div>
<label>TURNO</label><div class="turnos"><button class="turno" id="manha" onclick="setTurno('manha')">☀️ MANHÃ<br><small>07:00</small></button><button class="turno" id="tarde" onclick="setTurno('tarde')">🌙 TARDE<br><small>16:49</small></button></div>

<div style="margin-top:12px;padding:12px;border:2px solid #dce7ef;border-radius:14px;background:#f8fbfd">
  <div style="font-size:13px;font-weight:700;margin-bottom:8px">REGISTRO RÁPIDO DO TURNO</div>
  <div class="row">
    <button type="button" class="primary" style="margin-top:0" onclick="registrarEntradaAgora()">🟢 ENTRADA DO TURNO</button>
    <button type="button" class="secondary" style="margin-top:0" onclick="registrarSaidaAgora()">🔴 SAÍDA DO TURNO</button>
  </div>
  <div id="statusTurno" class="muted" style="margin-top:8px">Nenhum turno em andamento.</div>
</div>
<div class="row"><div><label>ENTRADA</label><input id="entrada" type="time"></div><div><label>SAÍDA FINAL</label><input id="saida" type="time"></div></div>
<div class="row"><div><label>SAÍDA INTERVALO</label><input id="almoco" type="time"></div><div><label>RETORNO</label><input id="retorno" type="time"></div></div>
<label>OBSERVAÇÃO</label><input id="obs" placeholder="Opcional">
<div class="result"><div>Horas trabalhadas</div><strong id="horas">--:--</strong><div style="margin-top:6px">Hora extra: <b id="extra">--:--</b></div></div>
<button class="primary" onclick="registrar()">💾 REGISTRAR PONTO</button>
<button class="share" onclick="compartilharApp()">📤 COMPARTILHAR MEU PONTO</button>
</div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>📅 Histórico</b><span class="badge" id="qtd">0 registros</span></div><div class="scroll" style="margin-top:10px"><table><thead><tr><th>Data</th><th>Turno</th><th>Entrada</th><th>Intervalo</th><th>Saída</th><th>Horas</th><th>Extra</th></tr></thead><tbody id="historico"></tbody></table></div><div class="row" style="margin-top:10px"><button class="secondary" onclick="exportar()">⬇️ Exportar CSV</button><button class="danger" onclick="limparHistorico()">🗑️ Apagar histórico</button></div></div>
<div class="card"><b>📊 Resumo</b><div class="row3" style="margin-top:10px;text-align:center"><div><div class="muted">Dias</div><b id="dias">0</b></div><div><div class="muted">Horas</div><b id="totalHoras">00:00</b></div><div><div class="muted">Extras</div><b id="totalExtra">00:00</b></div></div></div>
</main>
<script>
const KEY='meu_ponto_v2';
const PENDING_KEY='meu_ponto_turno_aberto_v2';
let dados=JSON.parse(localStorage.getItem(KEY)||'[]');
let turno='';
const $=id=>document.getElementById(id);

function hoje(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
$('data').value=hoje();

function horaCelular(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function mins(v){if(!v)return null;let [h,m]=v.split(':').map(Number);return h*60+m}
function fmt(n){n=Math.max(0,Math.round(n));let h=Math.floor(n/60),m=n%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function duracao(a,b){let x=mins(a),y=mins(b);if(x==null||y==null)return null;if(y<x)y+=1440;return y-x}

function setTurno(t){
  turno=t;
  $('manha').classList.toggle('ativo',t==='manha');
  $('tarde').classList.toggle('ativo',t==='tarde');
  if(t==='manha'){$('almoco').value='11:00';$('retorno').value='12:00'}
  else{$('almoco').value='19:00';$('retorno').value='20:00'}
  calcular();
}

$('entrada').addEventListener('change',()=>{let v=$('entrada').value;if(v==='07:00')setTurno('manha');else if(v==='16:49')setTurno('tarde');else calcular()});
$('saida').addEventListener('input',calcular);$('almoco').addEventListener('input',calcular);$('retorno').addEventListener('input',calcular);

function calcular(){
  let e=$('entrada').value,s=$('saida').value,al=$('almoco').value,re=$('retorno').value;
  if(!e||!s){$('horas').textContent='--:--';$('extra').textContent='--:--';return}
  let total;
  if(al&&re) total=duracao(e,al)+duracao(re,s); else total=duracao(e,s);
  let extra=Math.max(0,total-528);
  $('horas').textContent=fmt(total);$('extra').textContent=fmt(extra);
}

function turnoAberto(){try{return JSON.parse(localStorage.getItem(PENDING_KEY)||'null')}catch(e){return null}}
function atualizarStatusTurno(){
  const p=turnoAberto(),el=$('statusTurno'); if(!el)return;
  if(p) el.textContent='🟢 Turno em andamento • Entrada: '+p.e+' • '+(p.turno==='manha'?'MANHÃ':'TARDE');
  else el.textContent='Nenhum turno em andamento.';
}
function atualizarStatusRede(){
  const el=$('statusRede'); if(!el)return;
  el.textContent=navigator.onLine?'🟢 ONLINE':'🔴 OFFLINE — dados salvos neste celular';
}
window.addEventListener('online',atualizarStatusRede);window.addEventListener('offline',atualizarStatusRede);

function escolherTurnoAutomatico(){
  if(turno)return true;
  const t=mins(horaCelular());
  if(t>=360&&t<720){setTurno('manha');return true}
  if(t>=900&&t<1440){setTurno('tarde');return true}
  return false;
}

function registrarEntradaAgora(){
  const nome=$('nome').value.trim(),mat=$('mat').value.trim(),data=$('data').value;
  if(!nome||!mat||!data){alert('Preencha funcionário, matrícula e data antes de registrar a entrada.');return}
  if(turnoAberto()){alert('Já existe uma entrada em andamento. Registre a saída antes de iniciar outro turno.');return}
  if(!escolherTurnoAutomatico()){alert('Selecione MANHÃ ou TARDE antes de registrar a entrada.');return}
  const e=horaCelular();
  $('entrada').value=e;
  localStorage.setItem(PENDING_KEY,JSON.stringify({nome,mat,data,turno,e,al:$('almoco').value,re:$('retorno').value}));
  atualizarStatusTurno();calcular();
  alert('Entrada registrada às '+e+'.');
}

function registrarSaidaAgora(){
  const p=turnoAberto();
  if(!p){alert('Nenhuma entrada de turno foi registrada. Use a ENTRADA DO TURNO primeiro.');return}
  const s=horaCelular();
  const nome=p.nome,mat=p.mat,data=p.data,e=p.e,al=p.al,re=p.re;
  $('nome').value=nome;$('mat').value=mat;$('data').value=data;$('entrada').value=e;$('almoco').value=al;$('retorno').value=re;$('saida').value=s;turno=p.turno;
  $('manha').classList.toggle('ativo',turno==='manha');$('tarde').classList.toggle('ativo',turno==='tarde');
  const total=(al&&re)?duracao(e,al)+duracao(re,s):duracao(e,s),extra=Math.max(0,total-528);
  dados.push({nome,mat,data,turno:turno||'Manual',e,al,re,s,total,extra,obs:''});
  localStorage.setItem(KEY,JSON.stringify(dados));localStorage.removeItem(PENDING_KEY);
  render();atualizarStatusTurno();limparCampos();
  alert('Saída registrada às '+s+'. Ponto salvo no histórico.');
}

function limparCampos(){
  ['entrada','saida','almoco','retorno','obs'].forEach(id=>$(id).value='');
  turno='';$('manha').classList.remove('ativo');$('tarde').classList.remove('ativo');
  $('horas').textContent='--:--';$('extra').textContent='--:--';
}

function registrar(){
  let nome=$('nome').value.trim(),mat=$('mat').value.trim(),data=$('data').value,e=$('entrada').value,s=$('saida').value;
  if(!nome||!mat||!data||!e||!s){alert('Preencha funcionário, matrícula, data, entrada e saída final.');return}
  let al=$('almoco').value,re=$('retorno').value;
  let total,extra;
  if(al&&re){total=duracao(e,al)+duracao(re,s)}else{total=duracao(e,s)}
  extra=Math.max(0,total-528);
  dados.push({nome,mat,data,turno:turno||'Manual',e,al,re,s,total,extra,obs:$('obs').value.trim()});
  localStorage.setItem(KEY,JSON.stringify(dados));
  if(turnoAberto() && turnoAberto().e===e && turnoAberto().data===data) localStorage.removeItem(PENDING_KEY);
  render();limparCampos();atualizarStatusTurno();
  alert('Ponto registrado com sucesso!');
}

function render(){
  let tb=$('historico');tb.innerHTML='';
  dados.slice().reverse().forEach(x=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${x.data.split('-').reverse().join('/')}</td><td>${x.turno}</td><td>${x.e}</td><td>${x.al&&x.re?x.al+'–'+x.re:'—'}</td><td>${x.s}</td><td>${fmt(x.total)}</td><td>${fmt(x.extra)}</td>`;tb.appendChild(tr)});
  $('qtd').textContent=dados.length+' registro'+(dados.length===1?'':'s');$('dias').textContent=dados.length;$('totalHoras').textContent=fmt(dados.reduce((a,x)=>a+x.total,0));$('totalExtra').textContent=fmt(dados.reduce((a,x)=>a+x.extra,0));
}
function exportar(){if(!dados.length){alert('Não há registros para exportar.');return}let csv='Data;Funcionário;Matrícula;Turno;Entrada;Saída intervalo;Retorno;Saída;Horas trabalhadas;Hora extra;Observação\n';dados.forEach(x=>csv+=`${x.data};"${x.nome}";"${x.mat}";${x.turno};${x.e};${x.al||''};${x.re||''};${x.s};${fmt(x.total)};${fmt(x.extra)};"${x.obs||''}"\n`);let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='historico_ponto.csv';a.click();URL.revokeObjectURL(a.href)}
function limparHistorico(){if(confirm('Apagar todos os registros deste celular?')){dados=[];localStorage.removeItem(KEY);render()}}
async function compartilharApp(){const url='https://jcalves1972.github.io/meu-ponto/';try{if(navigator.share){await navigator.share({title:'Meu Ponto',text:'Acesse o aplicativo Meu Ponto:',url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Link copiado! Agora é só colar no WhatsApp.')}else{prompt('Copie o link do Meu Ponto:',url)}}catch(e){}}

atualizarStatusRede();atualizarStatusTurno();render();
</script>
<script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body></html>
