<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123B5D">
<title>Meu Ponto</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#eef3f7;font-family:Arial,sans-serif;color:#17324a}
header{background:#123b5d;color:#fff;padding:18px 16px 22px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:25px}.sub{opacity:.85;margin-top:5px;font-size:13px}
main{max-width:560px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #00000012}
label{font-size:12px;font-weight:700;display:block;margin:8px 0 5px}
input,select,button{width:100%;height:48px;border-radius:12px;border:1px solid #cbd6df;padding:0 13px;font-size:16px;background:#fff;color:#17324a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.turnos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.turno{border:2px solid #d4dee7;background:#f8fafc;font-weight:700}.turno.ativo{border-color:#1d6fa5;background:#e7f3fb}
.primary{background:#1d6fa5;color:#fff;border:0;font-weight:700;margin-top:12px}
.secondary{background:#edf2f6;border:0;font-weight:700}.danger{background:#fff0f0;color:#9b2525;border:0;font-weight:700}
.result{background:#e9f5ec;border-radius:14px;padding:13px;margin-top:12px}.result strong{font-size:22px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 5px;border-bottom:1px solid #e4e9ed;text-align:center}th{font-size:11px}
.scroll{overflow:auto}.muted{font-size:12px;color:#647789}.hidden{display:none}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eaf1f6;font-size:11px}
</style>
</head>
<body>
<header><main style="padding:0"><h1>📋 Meu Ponto</h1><div class="sub">Controle simples • funciona no celular • sem macro</div></main></header>
<main>
<div class="card">
<label>FUNCIONÁRIO</label><input id="nome" placeholder="Digite o nome">
<label>MATRÍCULA</label><input id="mat" placeholder="Digite a matrícula">
<div class="row">
<div><label>DATA</label><input id="data" type="date"></div>
<div><label>JORNADA</label><input value="09:48" disabled></div>
</div>
<label>TURNO</label>
<div class="turnos">
<button class="turno" id="manha" onclick="setTurno('manha')">☀️ MANHÃ<br><small>07:00</small></button>
<button class="turno" id="tarde" onclick="setTurno('tarde')">🌙 TARDE<br><small>16:49</small></button>
</div>
<div class="row">
<div><label>ENTRADA</label><input id="entrada" type="time"></div>
<div><label>SAÍDA FINAL</label><input id="saida" type="time"></div>
</div>
<div class="row">
<div><label>SAÍDA INTERVALO</label><input id="almoco" type="time" disabled></div>
<div><label>RETORNO</label><input id="retorno" type="time" disabled></div>
</div>
<label>OBSERVAÇÃO</label><input id="obs" placeholder="Opcional">
<div class="result">
<div>Horas trabalhadas</div><strong id="horas">--:--</strong>
<div style="margin-top:6px">Hora extra: <b id="extra">--:--</b></div>
</div>
<button class="primary" onclick="registrar()">💾 REGISTRAR PONTO</button>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>📅 Histórico</b><span class="badge" id="qtd">0 registros</span></div>
<div class="scroll" style="margin-top:10px">
<table><thead><tr><th>Data</th><th>Turno</th><th>Entrada</th><th>Intervalo</th><th>Saída</th><th>Horas</th><th>Extra</th></tr></thead>
<tbody id="historico"></tbody></table>
</div>
<div class="row" style="margin-top:10px"><button class="secondary" onclick="exportar()">⬇️ Exportar CSV</button><button class="danger" onclick="limparHistorico()">🗑️ Apagar histórico</button></div>
</div>

<div class="card">
<b>📊 Resumo</b>
<div class="row3" style="margin-top:10px;text-align:center">
<div><div class="muted">Dias</div><b id="dias">0</b></div>
<div><div class="muted">Horas</div><b id="totalHoras">00:00</b></div>
<div><div class="muted">Extras</div><b id="totalExtra">00:00</b></div>
</div>
</div>
</main>

<script>
const KEY='meu_ponto_v1'; let dados=JSON.parse(localStorage.getItem(KEY)||'[]'); let turno='';
const $=id=>document.getElementById(id);
function hoje(){let d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
$('data').value=hoje();
function setTurno(t){
 turno=t; $('manha').classList.toggle('ativo',t==='manha'); $('tarde').classList.toggle('ativo',t==='tarde');
 if(t==='manha'){ $('entrada').value='07:00'; $('almoco').value='11:00'; $('retorno').value='12:00';}
 else { $('entrada').value='16:49'; $('almoco').value='19:00'; $('retorno').value='20:00';}
 calcular();
}
$('entrada').addEventListener('change',()=>{let v=$('entrada').value;if(v==='07:00')setTurno('manha');else if(v==='16:49')setTurno('tarde');else calcular()});
$('saida').addEventListener('input',calcular);
function mins(v){if(!v)return null;let [h,m]=v.split(':').map(Number);return h*60+m}
function fmt(n){n=Math.max(0,Math.round(n));let h=Math.floor(n/60),m=n%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function duracao(a,b){let x=mins(a),y=mins(b);if(x==null||y==null)return null;if(y<x)y+=1440;return y-x}
function calcular(){
 let e=$('entrada').value,s=$('saida').value, al=$('almoco').value,re=$('retorno').value;
 if(!e||!s||!al||!re){$('horas').textContent='--:--';$('extra').textContent='--:--';return}
 let total=duracao(e,al)+duracao(re,s), extra=Math.max(0,total-588);
 $('horas').textContent=fmt(total);$('extra').textContent=fmt(extra);
}
function registrar(){
 let nome=$('nome').value.trim(),mat=$('mat').value.trim(),data=$('data').value,e=$('entrada').value,s=$('saida').value;
 if(!nome||!mat||!data||!e||!s){alert('Preencha funcionário, matrícula, data, entrada e saída final.');return}
 let al=$('almoco').value,re=$('retorno').value;
 if(!al||!re){alert('Selecione o turno para preencher o intervalo automaticamente.');return}
 let total=duracao(e,al)+duracao(re,s), extra=Math.max(0,total-588);
 dados.push({nome,mat,data,turno:turno||'Manual',e,al,re,s,total,extra,obs:$('obs').value.trim()});
 localStorage.setItem(KEY,JSON.stringify(dados)); render();
 $('saida').value='';$('obs').value='';$('horas').textContent='--:--';$('extra').textContent='--:--';
 alert('Ponto registrado com sucesso!');
}
function render(){
 let tb=$('historico');tb.innerHTML='';
 dados.slice().reverse().forEach(x=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${x.data.split('-').reverse().join('/')}</td><td>${x.turno}</td><td>${x.e}</td><td>${x.al}–${x.re}</td><td>${x.s}</td><td>${fmt(x.total)}</td><td>${fmt(x.extra)}</td>`;tb.appendChild(tr)});
 $('qtd').textContent=dados.length+' registro'+(dados.length===1?'':'s');$('dias').textContent=dados.length;
 $('totalHoras').textContent=fmt(dados.reduce((a,x)=>a+x.total,0));$('totalExtra').textContent=fmt(dados.reduce((a,x)=>a+x.extra,0));
}
function exportar(){
 if(!dados.length){alert('Não há registros para exportar.');return}
 let csv='Data;Funcionário;Matrícula;Turno;Entrada;Saída intervalo;Retorno;Saída;Horas trabalhadas;Hora extra;Observação\n';
 dados.forEach(x=>csv+=`${x.data};"${x.nome}";"${x.mat}";${x.turno};${x.e};${x.al};${x.re};${x.s};${fmt(x.total)};${fmt(x.extra)};"${x.obs||''}"\n`);
 let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='historico_ponto.csv';a.click();URL.revokeObjectURL(a.href);
}
function limparHistorico(){if(confirm('Apagar todos os registros deste celular?')){dados=[];localStorage.removeItem(KEY);render()}}
render();
</script>
</body></html>
